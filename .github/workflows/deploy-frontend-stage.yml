name: Deploy Frontend to Stage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/timiry/shels-learn/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /root/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=stage

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy on stage host over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            FRONTEND_IMAGE="${{ env.IMAGE_NAME }}:stage"
            NEXT_PUBLIC_API_URL="${{ vars.STAGE_PUBLIC_BASE_URL }}"
            GHCR_USERNAME="${{ github.actor }}"
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"

            export FRONTEND_IMAGE
            export NEXT_PUBLIC_API_URL
            export FRONTEND_CONTAINER="courses-frontend"
            export FRONTEND_HOST_PORT="3000"
            export FRONTEND_DEPLOY_DIR="${{ env.DEPLOY_PATH }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            mkdir -p "$FRONTEND_DEPLOY_DIR"
            docker pull "$FRONTEND_IMAGE"

            if docker ps -a --format '{{.Names}}' | grep -qx "$FRONTEND_CONTAINER"; then
              docker rm -f "$FRONTEND_CONTAINER"
            fi

            docker run -d \
              --name "$FRONTEND_CONTAINER" \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
              -p "127.0.0.1:${FRONTEND_HOST_PORT}:3000" \
              "$FRONTEND_IMAGE"

            sleep 5
            docker ps --filter "name=$FRONTEND_CONTAINER" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
